<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAR! Mizan | Sport Professionnel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-pro">
        <nav class="navbar">
            <div class="logo">
                <img src="icon/vecteezy_black-silhouette-of-a-running-shoe-with-flames-and-lightning_70595360.jpg" alt="Logo DAR! Mizan" class="logo-img">
                DAR! <span>Mizan</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Accueil</a></li>
                <li><a href="produits.html">Produits</a></li>
                <li><a href="infos.html">S'inscrire</a></li>
            </ul>
            <div class="nav-actions">
                <a href="connexion.html" class="btn-login">Login</a>
            </div>
        </nav>
    </header>
    <main class="form-container">
        <form class="infos-form">
            <h2>Informations <span>Étudiant</span></h2>

            <fieldset>
                <legend>Information Personnelle</legend>
                <input type="text" id="reg-nom" placeholder="Nom (Sera votre identifiant)" required>
                <input type="password" id="reg-mdp" placeholder="Créer un mot de passe" required style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
                <input type="text" placeholder="Prénom">
            
                <div class="gender-box">
                    <span>Genre :</span>
                    <input type="radio" name="genre" id="f"> <label for="f">Fille</label>
                    <input type="radio" name="genre" id="g"> <label for="g">Garçon</label>
                </div>
            
                <input type="text" placeholder="Lieu de naissance">
                <textarea placeholder="Votre adresse complète"></textarea>
            </fieldset>

            <fieldset>
                <legend>Scolarité</legend>
                <select>
                    <option>Niveau d'étude</option>
                    <option>Lycée</option>
                    <option>Universitaire</option>
                </select>
            
                <div class="skills-box">
                    <p>Compétences :</p>
                    <label><input type="checkbox"> Programmation</label>
                    <label><input type="checkbox"> Design UI/UX</label>
                </div>
            </fieldset>

            <button type="submit" class="btn-submit">Finaliser mon inscription</button>
        </form>
    </main>

    <footer class="login-footer-main">
        <p>&copy; 2026 DAR! Mizan. Tous droits réservés.</p>
        <div class="footer-links">
            <a href="#">Conditions d'utilisation</a>
            <a href="#">Politique de confidentialité</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>

    <script>
        // Gestion de l'inscription
        document.querySelector('.infos-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Empêche l'envoi classique du formulaire

            const nom = document.getElementById('reg-nom').value;
            const mdp = document.getElementById('reg-mdp').value;

            if(nom && mdp) {
                // On récupère les utilisateurs existants ou on crée une liste vide
                let users = JSON.parse(localStorage.getItem('users')) || [];
                
                // On ajoute le nouvel utilisateur
                users.push({ username: nom, password: mdp });
                
                // On sauvegarde dans le navigateur
                localStorage.setItem('users', JSON.stringify(users));

                alert("Inscription réussie ! Vous allez être redirigé vers la page de connexion.");
                window.location.href = "connexion.html";
            } else {
                alert("Veuillez remplir le nom et le mot de passe.");
            }
        });
    </script>
</body>
</html>
