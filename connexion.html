<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAR! Mizan | Connexion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="body-login">
    <header class="header-pro">
        <nav class="navbar">
            <div class="logo">
                <img src="icon/vecteezy_black-silhouette-of-a-running-shoe-with-flames-and-lightning_70595360.jpg" alt="Logo DAR! Mizan" class="logo-img">
                DAR! <span>Mizan</span>
            </div>

            <div class="nav-right-group">
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Accueil</a></li>
                    <li><a href="produits.html">Produits</a></li>
                    <li><a href="connexion.html" class="btn-login">Se connecter</a></li>
                </ul>
                <button onclick="toggleTheme()" class="theme-btn"><i class="fas fa-sun"></i></button>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>


    <main class="login-container"> <div class="login-card">
            <div class="login-content">
                <h2>Se <span>Connecter</span></h2>
                <p class="subtitle">Accédez à votre compte</p>

                <form>
                    <div class="input-box">
                        <label>Adresse e-mail</label>
                        <input type="email" id="login-email" placeholder="votre@email.com" required>
                    </div>
                    <div class="input-box">
                        <label>Mot de passe</label>
                        <input type="password" id="login-pass" placeholder="••••••••" required>
                    </div>

                    <!-- SE SOUVENIR DE MOI (V6.2) -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember-me"> Se souvenir de moi
                        </label>
                        <a href="#">Mot de passe oublié ?</a>
                    </div>

                    <button type="submit" class="btn-glow">Connexion</button>
                </form>

                <div class="login-footer">
                    <p>Pas encore de compte ? <a href="infos.html">S'inscrire ici</a></p>
                </div>
            </div>
        </div>

    </main> 

    <footer class="login-footer-main">
        <p>&copy; 2026 DAR! Mizan. Tous droits réservés.</p>
        <div class="footer-links">
            <a href="conditions.html">Conditions d'utilisation</a>
            <a href="politique.html">Politique de confidentialité</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>

    <script>
        // GESTION DU THÈME
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            const btn = document.querySelector('.theme-btn i');
            if(btn) btn.className = isLight ? 'fas fa-moon' : 'fas fa-sun';
        }
        if(localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }

        document.addEventListener("DOMContentLoaded", function() {
            // Icône thème
            if(localStorage.getItem('theme') === 'light') {
                const btn = document.querySelector('.theme-btn i');
                if(btn) btn.className = 'fas fa-moon';
            }

            // --- SE SOUVENIR DE MOI (V6.2) ---
            // Pré-remplir l'email si il a été sauvegardé
            const savedEmail = localStorage.getItem('remembered_email');
            if (savedEmail) {
                document.getElementById('login-email').value = savedEmail;
                document.getElementById('remember-me').checked = true;
            }

            // VÉRIFICATION SI DÉJÀ CONNECTÉ
            const currentUser = localStorage.getItem('currentUser');
            
            // SÉCURITÉ : Redirection immédiate si c'est l'admin
            if (currentUser === 'Jeddy') {
                window.location.href = "admin.html";
                return;
            }

            if (currentUser) {
                // Si connecté, on remplace le contenu de la carte
                const loginContent = document.querySelector('.login-content');
                loginContent.innerHTML = `
                    <h2>Compte <span>Actif</span></h2>
                    <p class="subtitle">Bonjour ${currentUser}</p>
                    <div style="text-align: center; margin: 40px 0;">
                        <i class="fas fa-user-check" style="font-size: 4rem; color: #38bdf8; margin-bottom: 20px;"></i>
                        <p style="color: #94a3b8; margin-bottom: 20px; line-height: 1.5;">
                            Vous êtes déjà connecté sur ce navigateur.<br>
                            Vous devez vous déconnecter pour changer de compte.
                        </p>
                        <button id="force-logout" class="btn-glow" style="background: #ef4444; color: white;">Se déconnecter maintenant</button>
                        <a href="index.html" class="btn-glow" style="display:block; text-align:center; text-decoration:none; margin-top:15px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white;">Retour à l'accueil</a>
                    </div>
                `;

                // Action du bouton déconnexion
                document.getElementById('force-logout').addEventListener('click', function() {
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('remembered_email'); // On oublie l'email
                    window.location.reload(); // Recharge la page pour réafficher le formulaire
                });

            } else {
                // Si PAS connecté, on active le formulaire normalement
                const form = document.querySelector('form');
                if(form) {
                    form.addEventListener('submit', function(e) {
                        e.preventDefault();
                        const emailVal = document.getElementById('login-email').value.trim();
                        const passVa
                        // --- VÉRIFICATION ADMIN (Système Pro) ---
                        // L'admin se connecte toujours avec son nom d'utilisateur spécial
                        if (emailVal === 'Jeddy' && passVal === '190308') {
                            localStorage.setItem('currentUser', 'Jeddy'); // On enregistre la session admin
                            window.location.href = "admin.html"; // Redirection vers l'admin
                            return;
                        }

                        let users = JSON.parse(localStorage.getItem('users')) || [];
                        // On cherche l'utilisateur par email et mot de passe
                        let userFound = users.find(u => u.email && u.email.toLowerCase() === emailVal.toLowerCase() && u.password === passVal);

                        if (userFound) {
                            localStorage.setItem('currentUser', userFound.username);
                            alert("Connexion réussie ! Bienvenue " + userFound.username);
                            window.location.href = "index.html";
                        } else {ct.");
                        }
                }
            }

            // GESTION DU MENU B
            const navLinks = document.querySelector('.nav-links');

            if(hamburger) {
                hamburger.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                    const icon = hamburger.querySelector('i');
                    icon.classList.toggle('fa-bars');
                    icon.classList.toggle('fa-times');
                });

                // Fermeture auto
                document.querySelectorAll('.nav-links a, .nav-links button').forEach(item => {
                    item.addEventListener('click', () => {
                        navLinks.classList.remove('active');
                        const icon = hamburger.querySelector('i');
                        if(icon) { icon.classList.add('fa-bars'); icon.classList.remove('fa-times'); }
                    });
                });
            }
        });

        // Gestion du rétrécissement du header au scroll (V5.4)
        window.addEventListener('scroll', function() {
            const header = document.querySelector('.header-pro');
            if (window.scrollY > 50) { // Se déclenche après 50px de scroll
                header.classList.add('shrink');
            } else {
                header.classList.remove('shrink');
            }
        });
    </script>
</body>
</html>
