<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAR! Mizan | Connexion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="body-login">
    <header class="header-pro">
        <nav class="navbar">
            <div class="logo">
                <img src="icon/vecteezy_black-silhouette-of-a-running-shoe-with-flames-and-lightning_70595360.jpg" alt="Logo DAR! Mizan" class="logo-img">
                DAR! <span>Mizan</span>
            </div>

            <div class="nav-right-group">
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Accueil</a></li>
                    <li><a href="produits.html">Produits</a></li>
                    <li><a href="connexion.html" class="btn-login">Se connecter</a></li>
                </ul>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>


    <main class="login-container"> <div class="login-card">
            <div class="login-content">
                <h2>Se <span>Connecter</span></h2>
                <p class="subtitle">Accédez à votre compte</p>

                <form>
                    <div class="input-box">
                        <label>Nom d'utilisateur</label>
                        <input type="text" id="login-user" placeholder="Entrez votre nom" required>
                    </div>
                    <div class="input-box">
                        <label>Mot de passe</label>
                        <input type="password" id="login-pass" placeholder="••••••••" required>
                    </div>
                
                    <button type="submit" class="btn-glow">Connexion</button>
                </form>

                <div class="separateur">OU CONTINUER AVEC</div>

                <div class="social-icons">
                    <a href="#" onclick="socialLogin('Google')"><img src="icon/google.png" alt="Google"></a>
                    <a href="#" onclick="socialLogin('Apple')"><i class="fab fa-apple" style="font-size: 24px; color: white;"></i></a>
                    <a href="#" onclick="socialLogin('Facebook')"><img src="icon/facebook (1).png" alt="Facebook"></a>
                </div>

                <div class="login-footer">
                    <p>Mot de passe oublié ? <a href="#">Cliquer ici</a></p>
                    <p>Pas encore de compte ? <a href="infos.html">S'inscrire ici</a></p>
                </div>
            </div>
        </div>

    </main> 

    <footer class="login-footer-main">
        <p>&copy; 2026 DAR! Mizan. Tous droits réservés.</p>
        <div class="footer-links">
            <a href="conditions.html">Conditions d'utilisation</a>
            <a href="politique.html">Politique de confidentialité</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // VÉRIFICATION SI DÉJÀ CONNECTÉ
            const currentUser = localStorage.getItem('currentUser');
            
            if (currentUser) {
                // Si connecté, on remplace le contenu de la carte
                const loginContent = document.querySelector('.login-content');
                loginContent.innerHTML = `
                    <h2>Compte <span>Actif</span></h2>
                    <p class="subtitle">Bonjour ${currentUser}</p>
                    <div style="text-align: center; margin: 40px 0;">
                        <i class="fas fa-user-check" style="font-size: 4rem; color: #38bdf8; margin-bottom: 20px;"></i>
                        <p style="color: #94a3b8; margin-bottom: 20px; line-height: 1.5;">
                            Vous êtes déjà connecté sur ce navigateur.<br>
                            Vous devez vous déconnecter pour changer de compte.
                        </p>
                        <button id="force-logout" class="btn-glow" style="background: #ef4444; color: white;">Se déconnecter maintenant</button>
                        <a href="index.html" class="btn-glow" style="display:block; text-align:center; text-decoration:none; margin-top:15px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white;">Retour à l'accueil</a>
                    </div>
                `;

                // Action du bouton déconnexion
                document.getElementById('force-logout').addEventListener('click', function() {
                    localStorage.removeItem('currentUser');
                    window.location.reload(); // Recharge la page pour réafficher le formulaire
                });

            } else {
                // Si PAS connecté, on active le formulaire normalement
                const form = document.querySelector('form');
                if(form) {
                    form.addEventListener('submit', function(e) {
                        e.preventDefault();
                        const userVal = document.getElementById('login-user').value;
                        const passVal = document.getElementById('login-pass').value;
                        let users = JSON.parse(localStorage.getItem('users')) || [];
                        let userFound = users.find(u => u.username === userVal && u.password === passVal);

                        if (userFound) {
                            localStorage.setItem('currentUser', userVal);
                            alert("Connexion réussie ! Bienvenue " + userVal);
                            window.location.href = "index.html";
                        } else {
                            alert("Nom d'utilisateur ou mot de passe incorrect.");
                        }
                    });
                }
            }

            // GESTION DU MENU BURGER (Reste actif dans tous les cas)
            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');

            if(hamburger) {
                hamburger.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                    const icon = hamburger.querySelector('i');
                    icon.classList.toggle('fa-bars');
                    icon.classList.toggle('fa-times');
                });
            }
        });

        // FONCTION SOCIAL LOGIN (Globale)
        function socialLogin(provider) {
            // On simule un délai réseau pour faire "vrai"
            alert("Redirection vers " + provider + " pour l'authentification...");
            
            setTimeout(() => {
                localStorage.setItem('currentUser', "Utilisateur " + provider);
                alert("Connexion réussie avec " + provider + " !");
                window.location.href = "index.html";
            }, 1000);
        }
    </script>
</body>
</html>
