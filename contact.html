<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAR! Mizan | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="body-login">
    <header class="header-pro">
        <nav class="navbar">
            <div class="logo">
                <img src="icon/vecteezy_black-silhouette-of-a-running-shoe-with-flames-and-lightning_70595360.jpg" alt="Logo DAR! Mizan" class="logo-img">
                DAR! <span>Mizan</span>
            </div>
            <div class="nav-right-group">
                <ul class="nav-links">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="produits.html">Produits</a></li>
                    <li><a href="connexion.html" class="btn-login">Se connecter</a></li>
                </ul>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="login-content">
                <h2>Contactez-<span>Nous</span></h2>
                <p class="subtitle">Une question ? Nous vous répondons sous 24h.</p>

                <form action="#">
                    <div class="input-box">
                        <label>Email</label>
                        <input type="email" placeholder="votre@email.com" required>
                    </div>
                    <div class="input-box">
                        <label>Message</label>
                        <textarea placeholder="Comment pouvons-nous vous aider ?" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn-glow">Envoyer le message</button>
                </form>

                <div class="login-footer" style="margin-top: 20px;">
                    <p><i class="fas fa-phone" style="color: var(--primary-blue);"></i> +261 32 02 222 56</p>
                    <p><i class="fas fa-envelope" style="color: var(--primary-blue);"></i> support@mizan.mg</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="login-footer-main">
        <p>&copy; 2026 DAR! Mizan. Tous droits réservés.</p>
        <div class="footer-links">
            <a href="conditions.html">Conditions d'utilisation</a>
            <a href="politique.html">Politique de confidentialité</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>

    <script>
        // Vérifier si l'utilisateur est connecté pour changer le bouton Login en Logout
        document.addEventListener("DOMContentLoaded", function() {
            const currentUser = localStorage.getItem('currentUser');
            const loginBtn = document.querySelector('.btn-login');

            if (currentUser && loginBtn) {
                loginBtn.textContent = "Se déconnecter";
                loginBtn.href = "#";
                loginBtn.style.backgroundColor = "#dc3545"; 
                loginBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if(confirm("Voulez-vous vous déconnecter ?")) {
                        localStorage.removeItem('currentUser');
                        window.location.reload();
                    }
                });
            }

            // GESTION DU FORMULAIRE CONTACT (SIMULATION)
            const contactForm = document.querySelector('form');
            if(contactForm) {
                contactForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    alert("Merci ! Votre message a bien été envoyé à l'équipe DAR! Mizan.");
                    this.reset(); // Vide les champs
                });
            }

            // GESTION DU MENU BURGER
            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');

            if(hamburger) {
                hamburger.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                    // Change l'icône
                    const icon = hamburger.querySelector('i');
                    icon.classList.toggle('fa-bars');
                    icon.classList.toggle('fa-times');
                });
            }
        });
    </script>
</body>
</html>
