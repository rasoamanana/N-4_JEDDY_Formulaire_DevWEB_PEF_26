<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAR! Mizan - Nike Shop</title>
    <link rel="icon" href="icon/vecteezy_black-silhouette-of-a-running-shoe-with-flames-and-lightning_70595360.jpg">
    <link rel="stylesheet" href="boutique.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="header-pro">
        <nav class="navbar">
            <div class="logo">
                <img src="icon/vecteezy_black-silhouette-of-a-running-shoe-with-flames-and-lightning_70595360.jpg" alt="Logo DAR! Mizan" class="logo-img">
                DAR! <span>Mizan</span>
            </div>
            <div class="nav-right-group">
                <ul class="nav-links">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="produits.html" class="active">Produits</a></li>
                    <li><a href="connexion.html" class="btn-login">Se connecter</a></li>
                </ul>
                <button onclick="toggleTheme()" class="theme-btn"><i class="fas fa-sun"></i></button>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>

    <section id="mizan-shop">
        <!-- BARRE DE RECHERCHE ET FILTRES (V4.0) -->
        <div class="shop-controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Rechercher une chaussure (ex: Pegasus)...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn" onclick="trierPrix('asc')"><i class="fas fa-sort-amount-down-alt"></i> Prix Croissant</button>
                <button class="filter-btn" onclick="trierPrix('desc')"><i class="fas fa-sort-amount-up"></i> Prix Décroissant</button>
            </div>
        </div>

        <div class="products-grid" id="products-grid">
            <!-- SKELETONS (Chargement) -->
            <script>
                // Génère 8 cartes skeleton pour le chargement initial
                const skeletonHTML = `
                    <article class="skeleton-card">
                        <div class="skeleton skeleton-img"></div>
                        <div class="info">
                            <div class="skeleton skeleton-title"></div>
                            <div class="skeleton skeleton-subtitle"></div>
                            <div class="skeleton-footer">
                                <div class="skeleton skeleton-price"></div>
                                <div class="skeleton skeleton-btn"></div>
                            </div>
                        </div>
                    </article>
                `;
                document.write(skeletonHTML.repeat(8));
            </script>
        </div>
    </section>

    

    <footer class="login-footer-main">
        <p>&copy; 2026 DAR! Mizan. Tous droits réservés.</p>
        <div class="footer-links">
            <a href="conditions.html">Conditions d'utilisation</a>
            <a href="politique.html">Politique de confidentialité</a>
            <a href="contact.html">Contact</a>
            <a href="admin.html" id="admin-link" style="opacity: 0.5; display: none;"><i class="fas fa-lock"></i> Admin</a>
        </div>
    </footer>

    <div id="payment-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-shopping-bag"></i> Mon Panier</h2>
            <span class="close" onclick="fermerModal()">&times;</span>
        </div>
        
        <div class="modal-body">
            <div id="cart-items-list">
                <!-- Les articles s'afficheront ici -->
            </div>
        </div>

        <div class="modal-footer">
            <!-- VUE 1 : SÉLECTION -->
            <div id="payment-selection">
                <div class="summary">
                    <p class="total-line">Total : <span id="modal-total">0.00</span> €</p>
                    <button class="btn-clear" onclick="viderPanier()">Vider</button>
                </div>

                <p class="payment-title">Paiement sécurisé via</p>
                <div class="payment-options">
                    <button class="pay-btn orange" onclick="payer('Orange Money')"><i class="fas fa-money-bill-wave"></i> Orange</button>
                    <button class="pay-btn mvola" onclick="payer('Mvola')"><i class="fas fa-mobile-alt"></i> Mvola</button>
                    <button class="pay-btn paypal" onclick="payer('PayPal')"><i class="fab fa-paypal"></i> PayPal</button>
                    <button class="pay-btn card-bank" onclick="payer('Carte Bancaire')"><i class="fas fa-credit-card"></i> Carte</button>
                </div>
            </div>

            <!-- VUE 2 : FORMULAIRE DYNAMIQUE -->
            <div id="payment-form">
                <!-- Le contenu sera injecté par JS ici -->
            </div>
        </div>
    </div>
</div>

    <!-- BOUTON FLOTTANT PANIER (V4.0) -->
    <div class="floating-cart" onclick="ouvrirModal()">
        <div class="floating-count" id="float-cart-count">0</div>
        <i class="fas fa-shopping-bag"></i>
    </div>

    </body>

    <script>
       // --- GESTION AVANCÉE DU THÈME (V5.3) ---
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeIcon(isLight);
        }

        function updateThemeIcon(isLight) {
            const themeIcon = document.querySelector('.theme-btn i');
            if(themeIcon) themeIcon.className = isLight ? 'fas fa-moon' : 'fas fa-sun';
        }

        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme');
            let isLight;

            if (savedTheme) { // 1. Priorité au choix de l'utilisateur
                isLight = savedTheme === 'light';
            } else { // 2. Sinon, détection du système
                isLight = window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches;
            }

            if (isLight) document.body.classList.add('light-mode');
            updateThemeIcon(isLight);
        }
        initializeTheme(); // Appel immédiat pour éviter le flash de couleur

       let allProducts = []; // Stocke tous les produits pour le tri et la recherche
       let panier = []; 

        function ajouterAuPanier(nom, prix) {
            // VÉRIFICATION DE LA CONNEXION
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                alert("Vous devez être connecté pour ajouter des produits au panier !");
                window.location.href = "connexion.html";
                return;
            }

            const produit = { nom: nom, prix: prix };
            panier.push(produit);
            majAffichage();
        }

        // --- FONCTION VOIR DÉTAILS (V5.0) ---
        function voirDetails(nom, prix, img, badgeClass, badgeText, desc) {
            const product = { nom, prix, img, badgeClass, badgeText, desc };
            localStorage.setItem('selectedProduct', JSON.stringify(product));
            window.location.href = "details.html";
        }

        function supprimerProduit(index) {
            panier.splice(index, 1);
            majAffichage();
        }

        function viderPanier() {
            if(panier.length > 0) {
                if(confirm("Vider tout le panier ?")) {
                    panier = [];
                    majAffichage();
                    fermerModal();
                }
            }
        }

        function majAffichage() {
            const listConteneur = document.getElementById('cart-items-list');
            const totalAffichage = document.getElementById('modal-total');
            const floatCountAffichage = document.getElementById('float-cart-count');
            
            let htmlGenere = "";
            let totalCalcul = 0;

            panier.forEach((produit, index) => {
                totalCalcul += produit.prix;
                htmlGenere += `
                    <div class="cart-item">
                        <div class="item-info">
                            <span class="item-name">${produit.nom}</span>
                            <span class="item-price">${produit.prix.toFixed(2)} €</span>
                        </div>
                        <button class="remove-btn" onclick="supprimerProduit(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>`;
            });

            if (panier.length === 0) {
                htmlGenere = "<p>Votre panier est vide</p>";
            }

            listConteneur.innerHTML = htmlGenere;
            totalAffichage.innerText = totalCalcul.toFixed(2);
            if(floatCountAffichage) floatCountAffichage.innerText = panier.length;

            // MISE À JOUR DYNAMIQUE DU FORMULAIRE DE PAIEMENT (Si ouvert)
            const dynamicInput = document.getElementById('dynamic-pay-amount');
            if(dynamicInput) {
                dynamicInput.value = totalCalcul.toFixed(2) + " €";
            }
        }

        function ouvrirModal() { document.getElementById('payment-modal').style.display = "block"; }
        function fermerModal() { document.getElementById('payment-modal').style.display = "none"; }

        // --- LOGIQUE DE PAIEMENT INTELLIGENTE (V4.0) ---
        function payer(methode) {
            if (panier.length === 0) return alert("Panier vide !");
            
            const formContainer = document.getElementById('payment-form');
            const selectionContainer = document.getElementById('payment-selection');
            const total = document.getElementById('modal-total').innerText;

            let inputsHtml = "";

            // Génération du formulaire selon la méthode
            if (methode === 'Orange Money' || methode === 'Mvola') {
                inputsHtml = `
                    <label>Numéro ${methode}</label>
                    <input type="text" value="+261 " required style="font-weight: 600; letter-spacing: 1px;">
                    <label>Code Secret (4 chiffres)</label>
                    <input type="password" placeholder="••••" maxlength="4" required style="letter-spacing: 3px; font-size: 1.2rem;">
                    <label>Montant à payer</label>
                    <input type="text" id="dynamic-pay-amount" value="${total} €" readonly style="background: #e2e8f0; font-weight:bold; cursor: not-allowed;">
                `;
            } else if (methode === 'Carte Bancaire') {
                inputsHtml = `
                    <label>Numéro de Carte</label>
                    <input type="text" placeholder="0000 0000 0000 0000" required>
                    <div style="display:flex; gap:10px;">
                        <div style="flex:1;">
                            <label>Exp</label>
                            <input type="text" placeholder="MM/AA" required>
                        </div>
                        <div style="flex:1;">
                            <label>CVC</label>
                            <input type="text" placeholder="123" required>
                        </div>
                    </div>
                    <label>Montant</label>
                    <input type="text" id="dynamic-pay-amount" value="${total} €" readonly style="background: #e2e8f0; font-weight:bold;">
                `;
            } else { // PayPal
                inputsHtml = `
                    <label>Email PayPal</label>
                    <input type="email" placeholder="votre@email.com" required>
                    <label>Montant</label>
                    <input type="text" id="dynamic-pay-amount" value="${total} €" readonly style="background: #e2e8f0; font-weight:bold;">
                `;
            }

            // Injection du HTML
            formContainer.innerHTML = `
                <h3 style="margin-top:0; color:var(--mizan-dark); font-size:1.1rem; display:flex; align-items:center; gap:10px;">
                    <i class="fas fa-lock"></i> Paiement ${methode}
                </h3>
                ${inputsHtml}
                <button class="btn-confirm-pay" onclick="confirmerPaiement('${methode}')">Confirmer et Payer</button>
                <button class="btn-back" onclick="retourChoix()">Choisir une autre méthode</button>
            `;

            // Bascule de vue
            selectionContainer.style.display = 'none';
            formContainer.style.display = 'flex';
        }

        function retourChoix() {
            document.getElementById('payment-form').style.display = 'none';
            document.getElementById('payment-selection').style.display = 'block';
        }

        function confirmerPaiement(methode) {
            // VÉRIFICATION STRICTE AVANT PAIEMENT
            const inputs = document.querySelectorAll('#payment-form input');
            let erreur = false;

            inputs.forEach(input => {
                // On ne vérifie pas le champ montant (qui est en lecture seule)
                if (input.hasAttribute('readonly')) return;

                // Si vide ou si c'est le préfixe +261 non complété
                if (!input.value.trim() || input.value.trim() === "+261") {
                    erreur = true;
                    input.style.border = "2px solid red"; // Visuel rouge pour alerter
                } else {
                    input.style.border = "1px solid #cbd5e1"; // Remet la bordure normale
                }
            });

            if (erreur) return alert("Veuillez remplir correctement le Numéro et le Code Secret !");

            // Simulation "Génie" : Chargement -> Succès -> Livraison
            const btn = document.querySelector('.btn-confirm-pay');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Traitement en cours...';
            btn.style.opacity = "0.7";
            btn.disabled = true;

            setTimeout(() => {
                alert("✅ Paiement " + methode + " accepté avec succès !");
                alert("🚚 Votre commande est validée ! Livraison estimée : 48h.");
                
                // Reset total
                panier = [];
                majAffichage();
                fermerModal();
                retourChoix();
            }, 2500); // Délai de 2.5 secondes pour faire réaliste
        }

        // --- INITIALISATION DE LA PAGE ---
        document.addEventListener("DOMContentLoaded", function() {
            // Gérer le bouton de connexion/déconnexion
            const currentUser = localStorage.getItem('currentUser');
            
            // Affiche le lien Admin seulement si c'est Jeddy
            if (currentUser === 'Jeddy') {
                document.getElementById('admin-link').style.display = 'inline';
            }

            const loginBtn = document.querySelector('.btn-login');
            if (currentUser && loginBtn) {
                loginBtn.textContent = "Se déconnecter (" + currentUser + ")";
                loginBtn.href = "#";
                loginBtn.style.backgroundColor = "#dc3545"; // Rouge pour déconnexion
                loginBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if(confirm("Voulez-vous vous déconnecter ?")) { 
                        localStorage.removeItem('currentUser'); 
                        localStorage.removeItem('remembered_email'); // On oublie l'email
                        window.location.reload(); }
                });
            }

            // Gérer le menu burger
            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');
            if(hamburger) {
                hamburger.addEventListener('click', () => { navLinks.classList.toggle('active'); hamburger.querySelector('i').classList.toggle('fa-bars'); hamburger.querySelector('i').classList.toggle('fa-times'); });
                document.querySelectorAll('.nav-links a, .nav-links button').forEach(item => {
                    item.addEventListener('click', () => { navLinks.classList.remove('active'); const icon = hamburger.querySelector('i'); if(icon) { icon.classList.add('fa-bars'); icon.classList.remove('fa-times'); } });
                });
            }

            // Charger les produits et configurer les filtres
            initialiserBoutique();

            // Configurer la recherche
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('keyup', function(e) {
                const term = e.target.value.toLowerCase();
                const produitsFiltres = allProducts.filter(p => p.nom.toLowerCase().includes(term));
                renderProducts(produitsFiltres);
            });
        });

                // Gestion du rétrécissement du header au scroll (V5.4)
        window.addEventListener('scroll', function() {
            const header = document.querySelector('.header-pro');
            if (window.scrollY > 50) { // Se déclenche après 50px de scroll
                header.classList.add('shrink');
            } else {
                header.classList.remove('shrink');
            }
        });






        function initialiserBoutique() {
            // Produits statiques de la page
            const staticProducts = [
                { nom: 'Nike Air Zoom Pegasus 42', prix: 129.99, img: 'iimage/nikezoompegaus42.jpeg', badgeClass: 'card-red', badgeText: 'NOUVEAU' },
                { nom: 'Nike Air Zoom Fly 6', prix: 110.00, img: 'iimage/nike.zoomfly6.webp', badgeClass: 'card-orange', badgeText: 'PROMO' },
                { nom: 'Nike Air Zoom Vomero 5', prix: 129.00, img: 'iimage/vomero5.jpeg', badgeClass: 'card-green', badgeText: 'COLLECTION' },
                { nom: 'Nike Air Zoom Alphafly 3', prix: 129.80, img: 'iimage/alphaly3.jpeg', badgeClass: 'card-purple', badgeText: 'LIMITED' },
                { nom: 'Nike Air Zoom Structure 26', prix: 100.00, img: 'iimage/zoomstructure26.jpeg', badgeClass: 'card-red', badgeText: 'NOUVEAU' },
                { nom: 'Nike Air Zoom Vomero 18', prix: 120.89, img: 'iimage/nikezoomvomero18.jpeg', badgeClass: 'card-orange', badgeText: 'PROMO' },
                { nom: 'Nike Air Zoom Spiridon', prix: 90.00, img: 'iimage/spiridoncage 2.jpeg', badgeClass: 'card-green', badgeText: 'COLLECTION' },
                { nom: 'Nike Air Zoom Tempo%', prix: 100.50, img: 'iimage/tempo.jpeg', badgeClass: 'card-purple', badgeText: 'LIMITED' }
            ];

            // Produits dynamiques de l'admin
            const dynamicProducts = JSON.parse(localStorage.getItem('mizan_products') || '[]');

            // Fusion des deux listes
            allProducts = [...staticProducts, ...dynamicProducts];

            // Simulation d'un temps de chargement réseau
            setTimeout(() => {
                renderProducts(allProducts);
            }, 800); // 0.8 seconde
        }

        function renderProducts(productsToRender) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = ""; // Vide la grille (supprime les skeletons ou les anciens produits)

            if (productsToRender.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-gray); grid-column: 1 / -1; text-align: center;">Aucun produit ne correspond à votre recherche.</p>`;
                return;
            }

            productsToRender.forEach(p => {
                const productHTML = `
                <article class="card ${p.badgeClass}">
                    <span class="badge">${p.badgeText}</span>
                    <div class="img-container" onclick="voirDetails('${p.nom.replace(/'/g, "\\'")}', ${p.prix}, '${p.img}', '${p.badgeClass}', '${p.badgeText}', '${(p.desc || "").replace(/'/g, "\\'")}')" style="cursor: pointer;">
                        <img src="${p.img}" alt="${p.nom}" loading="lazy" decoding="async" onerror="this.src='iimage/nikezoompegaus42.jpeg'"> <!-- Image par défaut si erreur -->
                    </div>
                    <div class="info">
                        <h3>${p.nom}</h3>
                        <div class="card-footer">
                            <p class="price">${p.prix.toFixed(2)} €</p>
                            <button class="add-btn" onclick="ajouterAuPanier('${p.nom}', ${p.prix})">
                                <i class="fas fa-shopping-basket"></i>
                            </button>
                        </div>
                    </div>
                </article>
                `;
                grid.innerHTML += productHTML;
            });
        }

        // Fonction de tri (maintenant globale)
        function trierPrix(ordre) {
            allProducts.sort((a, b) => {
                return ordre === 'asc' ? a.prix - b.prix : b.prix - a.prix;
            });
            renderProducts(allProducts); // Ré-affiche les produits triés
        }
    </script>

</body>
</html>
